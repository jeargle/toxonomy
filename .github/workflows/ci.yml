name: checks

on:
  push:
    branches: [main]
  pull_request:

# One Pages deployment at a time; never cancel one mid-deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the database
        run: uv run python scripts/build_db.py toxonomy.db

      - name: Check catalog integrity
        run: uv run python scripts/check.py

      - name: Score distributions against the backbone
        run: uv run python scripts/reconcile.py

      # Rendered on PRs too, so a generator break shows before merge.
      - name: Render the website
        run: uv run python scripts/build_site.py toxonomy.db _site

      - name: Upload the website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: catalog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
